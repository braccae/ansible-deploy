---
- name: Setup Rootless Services
  hosts: the-red-raktuber
  become: true
  vars:
    init: true
    restore: false
  tasks:
    - name: Install Matterbridge
      ansible.builtin.include_tasks: tasks/matterbridge.yaml

    - name: Install n8n
      vars:
        user: core
        base_url: "{{ n8n.vars.BASE_URL }}"
        webhook_url: "{{ n8n.vars.BASE_URL }}"
        encryption_key: "{{ n8n.secrets.N8N_ENCRYPTION_KEY }}"
        db_pass: "{{ n8n.secrets.DB_PASS }}"
        db_admin_pass: "{{ central_db.secrets.POSTGRES_ROOT_PASS }}"
      ansible.builtin.include_tasks: tasks/n8n.yaml

    - name: Create Shorts DB User
      community.postgresql.postgresql_user:
        name: shorts
        password: "{{ shorts.secrets.PG_PASS }}"
        login_unix_socket: /run/postgres
        login_user: admin
        login_password: "{{ central_db.secrets.POSTGRES_ROOT_PASS }}"

    - name: Create Shorts Bot database
      community.postgresql.postgresql_db:
        login_unix_socket: /run/postgres
        # login_host:
        login_user: admin
        login_password: "{{ central_db.secrets.POSTGRES_ROOT_PASS }}"
        name: shorts
        owner: shorts
        state: present

    - name: Install Authentik
      vars:
        authentik_version: 2025.6
        email_use_tls: true
        email_use_ssl: false
        email_timeout: 15
        email_port: 587
        email_from: "{{ authentik.vars.EMAIL_FROM }}"
      ansible.builtin.include_tasks: tasks/auth.yaml

    - name: Install searx-ng
      vars:
        base_url: "{{ searxng.vars.BASE_URL }}"
      ansible.builtin.include_tasks: tasks/searx-ng.yaml


- name: Dropins
  become: true
  hosts: the-red-raktuber
  vars:
    init: true
    restore: false
  tasks:
    - name: Proxy Dropin - n8n
      become: true
      vars:
        base_url: "{{ n8n.vars.BASE_URL }}"
      ansible.builtin.template:
        src: files/configs/caddy/n8n.caddyfile
        dest: /var/home/proxy/appdata/caddy/caddyfile.d/20-n8n.caddyfile
        owner: proxy
        group: proxy
        mode: '755'

    - name: Proxy Dropin - search
      become: true
      vars:
        base_url: "{{ searxng.vars.BASE_URL }}"
      ansible.builtin.template:
        src: files/configs/caddy/search.caddyfile
        dest: /var/home/proxy/appdata/caddy/caddyfile.d/search.caddyfile
        owner: proxy
        group: proxy
        mode: '755'

    - name: Proxy Dropin - auth
      become: true
      vars:
        base_url: "{{ authentik.vars.BASE_URL }}"
      ansible.builtin.template:
        src: files/configs/caddy/auth.caddyfile
        dest: /var/home/proxy/appdata/caddy/caddyfile.d/auth.caddyfile
        owner: proxy
        group: proxy
        mode: '755'

    - name: Backup Dropin - n8n
      become: true
      ansible.builtin.copy:
        src: files/configs/borgmatic/borgmatic.d/n8n.yaml
        dest: /etc/borgmatic.d/20-n8n.yaml
        owner: root
        group: root
        mode: '755'

    - name: Backup Dropin - auth
      become: true
      ansible.builtin.copy:
        src: files/configs/borgmatic/borgmatic.d/auth.yaml
        dest: /etc/borgmatic.d/auth.yaml
        owner: root
        group: root
        mode: '755'

    - name: Proxy Dropin - PPC
      become: true
      vars:
        upstream: "http://100.104.99.76:11000"
        domain: "https://cloud.pants.place"
      ansible.builtin.template:
        src: templates/configs/caddyfile/caddyfile_http.j2
        dest: /var/home/proxy/appdata/caddy/caddyfile.d/pants-place-cloud.caddyfile
        owner: proxy
        group: proxy
        mode: '755'

    - name: Proxy Dropin - jellyfin
      become: true
      vars:
        upstream: "http://100.104.99.76:8096"
        domain: "https://jellyfin.pants.place"
      ansible.builtin.template:
        src: templates/configs/caddyfile/caddyfile_http.j2
        dest: /var/home/proxy/appdata/caddy/caddyfile.d/jellyfin.caddyfile
        owner: proxy
        group: proxy
        mode: '755'

    - name: Reload Caddy
      ansible.builtin.systemd_service:
        daemon_reload: false
        name: caddy
        state: "restarted"
