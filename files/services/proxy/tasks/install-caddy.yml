---
- name: Copy Quadlet
  become: true
  ansible.builtin.copy:
    src: files/services/proxy/quadlets/caddy.container
    dest: /etc/containers/systemd
    owner: root
    group: root
    mode: '755'

- name: Create Caddyfile Folder
  become: true
  ansible.builtin.file:
    dest: /var/home/proxy/appdata/caddy/caddyfile.d
    owner: proxy
    group: proxy
    mode: '775'
    state: directory

- name: Create Config Folder
  become: true
  ansible.builtin.file:
    dest: /var/home/proxy/appdata/caddy/config
    owner: proxy
    group: proxy
    mode: '775'
    state: directory

- name: Create Data Folder
  become: true
  ansible.builtin.file:
    dest: /var/home/proxy/appdata/caddy/data
    owner: proxy
    group: proxy
    mode: '775'
    state: directory

