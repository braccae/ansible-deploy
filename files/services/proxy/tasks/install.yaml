- name: Allow http in Public Zone
  ansible.posix.firewalld:
    state: enabled
    zone: public
    service: "http"
    immediate: true
    permanent: true

- name: Allow http2 in Public Zone
  ansible.posix.firewalld:
    state: enabled
    zone: public
    service: "http3"
    immediate: true
    permanent: true

- name: Allow https in Public Zone
  ansible.posix.firewalld:
    state: enabled
    zone: public
    service: "https"
    immediate: true
    permanent: true
