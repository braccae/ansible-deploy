- name: Create key in borgbase
  adhawkins.borgbase.borgbase_ssh:
    state: present
    apikey: "{{ secrets.borgbase_api }}"
    name: "ansible@{{ ansible_hostname }}"
    key: "{{ borg_ssh.public_key }}"
  register: borgbase_key

- name: Create repo
  adhawkins.borgbase.borgbase_repo:
    state: present
    apikey: "{{ secrets.borgbase_api }}"
    name: "{{ ansible_hostname }}"
    full_access_keys: []
    quota_enabled: true
    quota: 51200
    alert_days: 7
    append_only: true
    append_only_keys: ["{{ borgbase_key.key_id }}"]
  register: borgbase_repo

- name: Set borgbackup_ssh_host
  ansible.builtin.set_fact:
    repo_uri: "ssh://{{ borgbase_repo.repo_id }}@{{ borgbase_repo.repo_id }}.repo.borgbase.com/./repo"

- name: Template Common Borgmatic Config
  become: true
  ansible.builtin.template:
    dest: /etc/borgmatic/common.yaml
    src: files/services/backup/config/common.yaml
    owner: root
    group: root
    mode: '600'
    force: true

- name: Init Borg repo
  environment:
    BORG_PASSPHRASE: '{{ borgmatic.secrets.ENCRYPTION_PASSPHRASE }}'
  ansible.builtin.command:
    argv:
      - borg
      - init
      - --show-rc
      - --log-json
      - --debug
      - --encryption
      - repokey-blake2
      - --rsh
      - 'ssh -o StrictHostKeyChecking=accept-new -i /root/.ssh/borg'
      - '{{ repo_uri }}'
  # when: result.rc == 2
  register: result
  throttle: 1
  changed_when: result.rc == 0
  failed_when: result.rc == 2 and 'A repository already exists at' not in result.stderr or result.rc != 2 and result.rc != 0

