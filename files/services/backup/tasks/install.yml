---

- name: Write Default Borgmatic Config
  become: true
  ansible.builtin.copy:
    dest: /etc/borgmatic/config.yaml
    src: files/services/backup/config/config.yaml
    owner: root
    group: root
    mode: '600'
    force: true

- name: Ensure borgmatic.service.d directory exists
  become: true
  ansible.builtin.file:
    path: /etc/systemd/system/borgmatic.service.d
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Ensure Backup runtime directory
  become: true
  ansible.builtin.copy:
    content: |
      d /run/backup 0777 backup backup -
    dest: /etc/tmpfiles.d/backup-runtime.conf
    group: root
    mode: '755'

- name: Activate systemd-tmpfiles
  become: true
  ansible.builtin.command:
    argv:
      - systemd-tmpfiles
      - --create
      - --prefix=/run/backup
    creates: /tmp/backup

- name: Ensure SELinux fcontext for /run/backup is container_file_t
  # This command adds or modifies an fcontext rule for /run/backup(/.*)?
  # The /.* is important to apply it to subdirectories and files as well.
  community.general.sefcontext:
    target: "/run/backup(/.*)?"
    setype: container_file_t
    state: present

- name: Configure borgmatic service override
  become: true
  ansible.builtin.blockinfile:
    dest: /etc/systemd/system/borgmatic.service.d/override.conf
    block: |
      [Service]
      User=root
      RuntimeDirectory=backup/borgmatic
      CapabilityBoundingSet=~
      LoadCredentialEncrypted=borgmatic:/etc/credstore.encrypted/borgmatic/
      LoadCredentialEncrypted=centraldb:/etc/credstore.encrypted/centraldb/
      MemoryDenyWriteExecute=false
    create: true
    owner: root
    group: root
    mode: '0644'

- name: Create Borgmatic Credential Folder
  become: true
  ansible.builtin.file:
    dest: /etc/credstore.encrypted/borgmatic
    owner: root
    group: root
    mode: '754'
    state: directory

- name: Add Systemd Secret - Borgmatic Encryption Passphrase
  become: true
  ansible.builtin.shell:
    executable: /bin/bash
    cmd: >-
      set -o pipefail &&
      printf %s "{{ borgmatic.secrets.ENCRYPTION_PASSPHRASE }}" |
      systemd-creds encrypt --name=borgmatic.pw - /etc/credstore.encrypted/borgmatic.pw
  # no_log: true
    creates: /etc/credstore.encrypted/borgmatic.pw

- name: Create Borg SSH Key for Host
  community.crypto.openssh_keypair:
    state: present
    type: "ed25519"
    path: /root/.ssh/borg
    regenerate: full_idempotence
    owner: root
    group: root
    mode: '600'
  register: borg_ssh

