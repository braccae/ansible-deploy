---
- name: Ensure Quadlet directory
  become: true
  # when: user != 'root'
  ansible.builtin.file:
    dest: "/var/home/{{ user }}/.config/containers/systemd/n8n"
    owner: "{{ user }}"
    group: "{{ user }}"
    mode: '755'
    state: directory

- name: Copy n8n container
  become: true
  # when: user != 'root'
  ansible.builtin.template:
    dest: "/var/home/{{ user }}/.config/containers/systemd/n8n/n8n.container"
    src: ../quadlets/n8n.container
    owner: "{{ user }}"
    group: "{{ user }}"
    mode: '755'

- name: Copy pod
  become: true
  # when: user != 'root'
  ansible.builtin.template:
    dest: "/var/home/{{ user }}/.config/containers/systemd/n8n/n8n.pod"
    src: ../quadlets/n8n.pod
    owner: "{{ user }}"
    group: "{{ user }}"
    mode: '755'

- name: Copy valkey
  become: true
  # when: user != 'root'
  ansible.builtin.template:
    dest: "/var/home/{{ user }}/.config/containers/systemd/n8n/n8n-valkey.container"
    src: ../quadlets/n8n-valkey.container
    owner: "{{ user }}"
    group: "{{ user }}"
    mode: '755'

- name: Copy runner
  become: true
  # when: user != 'root'
  ansible.builtin.template:
    dest: "/var/home/{{ user }}/.config/containers/systemd/n8n/n8n-runner.container"
    src: ../quadlets/n8n-runner.container
    owner: "{{ user }}"
    group: "{{ user }}"
    mode: '755'

- name: Ensure Appdir - Rootless
  become: true
  # when: user != 'root'
  ansible.builtin.file:
    dest: "/var/home/{{ user }}/appdata/n8n/data"
    owner: "{{ user }}"
    group: "{{ user }}"
    mode: '755'
    state: directory

