- name: Enable Linger for service users
  become: true
  ansible.builtin.command:
    argv:
      - /usr/bin/loginctl
      - enable-linger
      - "{{ item.name }}"
    creates: "/var/lib/systemd/linger/{{ item.name }}"
  loop: "{{ service_users }}"
  when: item.linger

- name: Enable Podman socket for lingering service users
  become: true
  become_user: "{{ item.name }}"
  ansible.builtin.systemd_service:
    scope: user
    name: podman.socket
    enabled: true
  loop: "{{ service_users }}"
  when: item.linger

- name: Disable Podman service for lingering service users
  become: true
  become_user: "{{ item.name }}"
  ansible.builtin.systemd_service:
    scope: user
    name: podman.service
    enabled: false
  loop: "{{ service_users }}"
  when: item.linger

- name: Enable Podman auto update timer for lingering service users
  become: true
  become_user: "{{ item.name }}"
  ansible.builtin.systemd_service:
    scope: user
    name: podman-auto-update.timer
    enabled: true
  loop: "{{ service_users }}"
  when: item.linger

- name: Enable Podman restart.service for lingering service users
  become: true
  become_user: "{{ item.name }}"
  ansible.builtin.systemd_service:
    scope: user
    name: podman-restart.service
    enabled: true
  loop: "{{ service_users }}"
  when: item.linger

- name: Enable Podman clean-transient.service for lingering service users
  become: true
  become_user: "{{ item.name }}"
  ansible.builtin.systemd_service:
    scope: user
    name: podman-clean-transient.service
    enabled: true
  loop: "{{ service_users }}"
  when: item.linger

- name: Enable Podman auto update timer for system
  become: true
  ansible.builtin.systemd_service:
    name: podman-auto-update.timer
    enabled: true

- name: Enable Podman restart.service for system
  become: true
  ansible.builtin.systemd_service:
    name: podman-restart.service
    enabled: true

- name: Enable Podman clean-transient.service for system
  become: true
  ansible.builtin.systemd_service:
    name: podman-clean-transient.service
    enabled: true

- name: Add Ansible user to wheel group
  become: true
  ansible.builtin.user:
    append: true
    name: ansible
    groups:
      - wheel

# - name: TMP Remove old venv created by uv
#   ansible.builtin.file:
#     path: /var/home/ansible/venv
#     state: absent

- name: Ensure python venv for ansible
  become: true
  become_user: ansible
  ansible.builtin.command:
    argv:
      - python3
      - -m
      - venv
      - /home/ansible/venv
    creates: /home/ansible/venv
