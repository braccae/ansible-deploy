---
- name: Create Groups
  become: true
  ansible.builtin.group:
    name: "{{ item.name }}"
    gid: "{{ item.gid | default(omit) }}"
    state: present
  loop: "{{ service_users }}"

- name: Create users
  become: true
  ansible.builtin.user:
    name: "{{ item.name }}"
    uid: "{{ item.uid | default(omit) }}"
    group: "{{ item.name }}"
    state: present
  loop: "{{ service_users }}"

- name: Create User Folders
  become: true
  ansible.builtin.file:
    dest: "/var/home/{{ item.name }}/.config/containers/systemd"
    state: directory
    owner: "{{ item.name }}"
    group: "{{ item.name }}"
    mode: '0740'
  loop: "{{ service_users }}"

- name: Ensure User SubUID
  become: true
  ansible.builtin.lineinfile:
    path: /etc/subuid
    line: "{{ item.name }}:{{ item.uid * 1000 }}:65536"
    create: true
    state: present
    owner: root
    group: root
    mode: '0644'
  loop: "{{ service_users }}"
  when: item.linger

- name: Ensure User SubGID
  become: true
  ansible.builtin.lineinfile:
    dest: /etc/subgid
    line: "{{ item.name }}:{{ item.uid * 1000 }}:65536"
    create: true
    state: present
    owner: root
    group: root
    mode: '0644'
  loop: "{{ service_users }}"
  when: item.linger

