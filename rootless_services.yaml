    #     embedding_model: "{{ openwebui.vars.EMBEDDING_MODEL }}"
    #     secret_key: "{{ openwebui.secrets.SECRET_KEY }}"
    #     db_pass: "{{ openwebui.secrets.DB_PASS }}"
    #     db_admin_pass: "{{ central_db.secrets.POSTGRES_ROOT_PASS }}"
    #   ansible.builtin.include_tasks: files/services/openwebui/tasks/install.yaml

    - name: Shorts Bot Setup
      when: ansible_hostname == 'chuck'
      block:
        - name: Ensure Shorts DB User
          community.postgresql.postgresql_user:
            name: shorts
            password: "{{ shorts.secrets.PG_PASS }}"
            login_unix_socket: /run/postgres
            login_user: admin
            login_password: "{{ central_db.secrets.POSTGRES_ROOT_PASS }}"
        - name: Ensure Shorts Bot database
          community.postgresql.postgresql_db:
            login_unix_socket: /run/postgres
            # login_host:
            login_user: admin
            login_password: "{{ central_db.secrets.POSTGRES_ROOT_PASS }}"
            name: shorts
            owner: shorts
            state: present

    - name: Install Authentik
      when: ansible_hostname in ['chuck']
      vars:
        user: auth
        user_data: "{{ service_users | selectattr('name', 'equalto', user) | first }}"
        uid: "{{ user_data.uid }}"
        gid: "{{ user_data.gid }}"
        authentik_version: '2025.10'
        email_use_tls: true
        email_use_ssl: false
        email_timeout: 15
        email_port: 587
        email_from: "{{ authentik.vars.EMAIL_FROM }}"
      ansible.builtin.include_tasks: files/services/auth/tasks/install.yaml

    - name: Install searx-ng
      when: ansible_hostname == 'chuck'
      vars:
        user: apps
        user_data: "{{ service_users | selectattr('name', 'equalto', user) | first }}"
        uid: "{{ user_data.uid }}"
        gid: "{{ user_data.gid }}"
        base_url: "{{ searxng.vars.BASE_URL }}"
        secret_key: "{{ searxng.secrets.SECRET_KEY }}"
      ansible.builtin.include_tasks: files/services/searx-ng/tasks/install.yaml

