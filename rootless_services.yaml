- name: Dropins
  become: true
  hosts: init
  vars:
    init: true
    restore: false
  tasks:
    - name: Proxy Dropin - PPC
      when: ansible_hostname in ['chuck', 'likes-it-cold']
      become: true
      vars:
        upstream: "{{ pants_place_cloud_upstream }}"
        domain: "https://cloud.pants.place"
      ansible.builtin.template:
        src: templates/caddyfile/caddyfile_http.j2
        dest: /var/home/proxy/appdata/caddy/caddyfile.d/pants-place-cloud.caddyfile
        owner: proxy
        group: proxy
        mode: "755"

    - name: Proxy Dropin - jellyfin
      when: ansible_hostname in ['chuck', 'likes-it-cold']
      become: true
      vars:
        upstream: "{{ jellyfin_upstream }}"
        domain: "https://jellyfin.pants.place"
      ansible.builtin.template:
        src: templates/caddyfile/caddyfile_http.j2
        dest: /var/home/proxy/appdata/caddy/caddyfile.d/jellyfin.caddyfile
        owner: proxy
        group: proxy
        mode: "755"

