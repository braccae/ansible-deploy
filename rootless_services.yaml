---
- name: Setup Rootless Services
  hosts: init
  become: true
  vars:
    init: true
    restore: false

  tasks:
    - name: Install n8n
      when: ansible_hostname in ['chuck']
      vars:
        user: apps
        user_data: "{{ service_users | selectattr('name', 'equalto', user) | first }}"
        uid: "{{ user_data.uid }}"
        gid: "{{ user_data.gid }}"
        base_url: "{{ n8n.vars.BASE_URL }}"
        webhook_url: "{{ n8n.vars.BASE_URL }}"
        encryption_key: "{{ n8n.secrets.N8N_ENCRYPTION_KEY }}"
        db_pass: "{{ n8n.secrets.DB_PASS }}"
        db_admin_pass: "{{ central_db.secrets.POSTGRES_ROOT_PASS }}"
        runner_auth_token: "{{ n8n.secrets.RUNNER_AUTH_TOKEN }}"
      ansible.builtin.include_tasks: files/services/n8n/tasks/install.yaml

