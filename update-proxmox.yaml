---
- name: Update Proxmox systems
  become: true
  hosts: proxmox
  vars:
    # Replace this with your actual cache server IP or hostname
    apt_cache_server: "192.168.8.195"
    apt_cache_port: "3142"

  tasks:
    - name: Create APT proxy configuration file
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/00proxy
        content: |
          Acquire::http::Proxy "http://{{ apt_cache_server }}:{{ apt_cache_port }}";
          Acquire::https::Proxy "DIRECT";
        owner: root
        group: root
        mode: '0644'

    - name: Update APT cache to verify connection
      ansible.builtin.apt:
        update_cache: true
      register: apt_result
      ignore_errors: true

    - name: Check if proxy is working
      ansible.builtin.debug:
        msg: "APT successfully updated using the proxy!"
      when: apt_result is succeeded

    - name: Ensure the package cache is up to date
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Upgrade all installed packages (Standard Upgrade)
      ansible.builtin.apt:
        upgrade: true

    - name: Run Dist-Upgrade (Required for Proxmox kernel & core updates)
      ansible.builtin.apt:
        upgrade: dist
      register: upgrade_result

    - name: Remove useless packages from the cache
      ansible.builtin.apt:
        autoclean: true

    - name: Remove dependencies that are no longer required
      ansible.builtin.apt:
        autoremove: true

    - name: Check if a reboot is required
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required_file

    - name: Reboot the server if a new kernel or core package requires it
      ansible.builtin.reboot:
        msg: "Reboot initiated by Ansible after Proxmox updates"
        connect_timeout: 5
        reboot_timeout: 600
        pre_reboot_delay: 5
        test_command: uptime
      when: reboot_required_file.stat.exists

    - name: Download the update script
      ansible.builtin.get_url:
        url: https://raw.githubusercontent.com/community-scripts/ProxmoxVE/main/tools/pve/update-apps.sh
        dest: /tmp/update-apps.sh
        mode: '0755'

    - name: Execute the update script
      ansible.builtin.command: /tmp/update-apps.sh
      environment:
        var_unattended: "yes"
        var_skip_confirm: "yes"
        var_auto_reboot: "yes"
        var_container: "all"
        var_backup: "no"
      register: script_output
      changed_when: true

    - name: Cleanup the script
      ansible.builtin.file:
        path: /tmp/update-apps.sh
        state: absent
